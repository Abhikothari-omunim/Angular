<h1>Add Student Here.....</h1>
<div class="form-container">
    <h2>User Form</h2>
  
    <form (ngSubmit)="addStudent()" [formGroup] = "addStudentData" >
      <div>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" formControlName = "firstName"  name="firstName" required />
      </div>
  
      <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" formControlName = "lastName"  name="lastName" required />
      </div>
  
      <div>
        <label for="mobile">Mobile:</label>
        <input type="text" id="mobile" formControlName = "mobile"  name="mobile" required />
      </div>
  
      <button type="submit">Save</button>
    </form>
    {{formValue | json}}
  </div>
